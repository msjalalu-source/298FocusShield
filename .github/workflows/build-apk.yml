name: Build APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is $JAVA_VER, but version 17 or higher is required."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Add Android build-tools to PATH
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -d "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
            echo "Added $BUILD_TOOLS_DIR to PATH"
          else
            echo "Warning: No build-tools directory found under $SDK_DIR/build-tools"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Make Gradle wrapper executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Set up debug keystore (development only)
        run: |
          if [ -f "./debug.keystore.base64" ]; then
            echo "Restoring persistent debug.keystore from repository..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          elif [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to set up debug.keystore"
            exit 1
          fi
          echo "Debug keystore verified successfully."

      - name: Check production release signing secrets
        id: check_signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "Checking production release signing credentials..."
          CLEAN_B64=$(echo -n "$RELEASE_KEYSTORE_BASE64" | tr -d "[:space:]" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          CLEAN_PASS=$(echo -n "$RELEASE_STORE_PASSWORD" | tr -d '\r\n' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          CLEAN_ALIAS=$(echo -n "$RELEASE_KEY_ALIAS" | tr -d '\r\n' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")

          if [ -n "$CLEAN_B64" ] && [ -n "$CLEAN_PASS" ]; then
            echo "has_signing_secrets=true" >> $GITHUB_OUTPUT
            echo "effective_key_alias=${CLEAN_ALIAS:-focusshield}" >> $GITHUB_OUTPUT
            echo "✓ Production release signing secrets are configured."
          else
            echo "has_signing_secrets=false" >> $GITHUB_OUTPUT
            echo "Notice: Production release signing secrets are not configured in repository secrets."
            echo "Building release APK using debug keystore signature fallback."
          fi

      - name: Build optimized release APK
        id: build_release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ steps.check_signing.outputs.effective_key_alias }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
        run: |
          echo "Building optimized release APK (:app:assembleRelease)..."
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          else
            gradle :app:assembleRelease --stacktrace --no-daemon
          fi

          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "::error::Release APK was not generated at app/build/outputs/apk/release/app-release.apk"
            exit 1
          fi

      - name: Verify APK signature and security safeguards
        id: verify_apk
        run: |
          HAS_SECRETS="${{ steps.check_signing.outputs.has_signing_secrets }}"
          TARGET_APK="app/build/outputs/apk/release/app-release.apk"
          if [ "$HAS_SECRETS" = "true" ]; then
            BUILD_KIND="release"
            echo "Verifying production-signed release APK..."
          else
            BUILD_KIND="release-debug-signed"
            echo "Verifying release APK (debug keystore signed)..."
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "::error::Target APK not found at $TARGET_APK"
            exit 1
          fi

          echo "=================================================="
          echo "VERIFYING APK SIGNATURE: $TARGET_APK ($BUILD_KIND)"
          echo "=================================================="

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(which apksigner 2>/dev/null || find "$SDK_DIR/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner utility could not be located in $SDK_DIR/build-tools or PATH"
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"
          SIGNER_OUTPUT=$($APKSIGNER verify --verbose --print-certs "$TARGET_APK" 2>&1)
          echo "$SIGNER_OUTPUT"

          if ! echo "$SIGNER_OUTPUT" | grep -q "Verifies"; then
            echo "::error::APK signature verification failed for $TARGET_APK!"
            exit 1
          fi

          echo "=================================================="
          echo "VERIFYING MANIFEST & ACCESSIBILITY INTEGRITY"
          echo "=================================================="

          AAPT2=$(which aapt2 2>/dev/null || find "$SDK_DIR/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            echo "Using aapt2: $AAPT2"
            BADGING=$($AAPT2 dump badging "$TARGET_APK" 2>&1)

            # Robust package name extraction directly from aapt2 dump badging
            PKG_NAME=$(echo "$BADGING" | sed -n "s/^package:[[:space:]]*name=['\"]\([^'\"]*\)['\"].*/\1/p" | head -n 1 | tr -d '\r\n ')
            echo "Package Name: $PKG_NAME"
            if [ -z "$PKG_NAME" ]; then
              echo "::error::Could not extract package name from aapt2 dump badging output!"
              exit 1
            fi
            if [ "$PKG_NAME" != "com.jalaluddin.focusshield" ]; then
              echo "::error::Unexpected package name: '$PKG_NAME' (expected com.jalaluddin.focusshield)"
              exit 1
            fi

            # Robust targetSdkVersion extraction from aapt2 dump badging
            TARGET_SDK=$(echo "$BADGING" | sed -n "s/.*targetSdkVersion:[ ']*\([0-9]*\).*/\1/p" | head -n 1 | tr -d '\r\n ')
            echo "Target SDK: $TARGET_SDK"
            if [ -z "$TARGET_SDK" ]; then
              echo "::error::Could not extract targetSdkVersion from aapt2 dump badging output!"
              exit 1
            fi
            if [ "$TARGET_SDK" != "36" ]; then
              echo "::error::Unexpected targetSdkVersion: '$TARGET_SDK' (expected 36)"
              exit 1
            fi

            XML_TREE=$($AAPT2 dump xmltree --file AndroidManifest.xml "$TARGET_APK" 2>&1 || echo "")
            PERMISSIONS=$($AAPT2 dump permissions "$TARGET_APK" 2>&1 || echo "")

            if ! echo "$XML_TREE" | grep -q "FocusAccessibilityService"; then
              echo "::error::FocusAccessibilityService declaration missing in APK!"
              exit 1
            fi
            if ! echo "$XML_TREE" | grep -q "BIND_ACCESSIBILITY_SERVICE" && ! echo "$PERMISSIONS" | grep -q "BIND_ACCESSIBILITY_SERVICE"; then
              echo "::error::BIND_ACCESSIBILITY_SERVICE permission missing in APK!"
              exit 1
            fi
          else
            echo "Notice: aapt2 not found; skipping secondary manifest dump inspection."
          fi

          echo "target_apk=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "build_kind=$BUILD_KIND" >> $GITHUB_OUTPUT
          echo "Verification passed successfully for $BUILD_KIND APK."

      - name: Clean up temporary keystore files
        if: always()
        run: |
          rm -rf app/build/release-signing/
          echo "Temporary keystore material cleaned up."

      - name: Determine next sequential release build number
        id: build_number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=================================================="
          echo "DETERMINING NEXT SEQUENTIAL BUILD NUMBER"
          echo "=================================================="

          # 1. Fetch releases using GitHub CLI
          EXISTING_RELEASES=$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true)

          # 2. Fetch repository git tags via GitHub API
          REPO_TAGS=$(gh api repos/:owner/:repo/tags --paginate --jq '.[].name' 2>/dev/null || true)

          # 3. Fetch local git tags (from fetch-depth: 0)
          LOCAL_TAGS=$(git tag -l 2>/dev/null || true)

          # Combine and filter strictly for apk-build-<NUMBER>-* tags
          ALL_APK_TAGS=$(printf "%s\n%s\n%s\n" "$EXISTING_RELEASES" "$REPO_TAGS" "$LOCAL_TAGS" | grep -E '^apk-build-[0-9]+' | sort -u)

          echo "Detected historical apk-build tags:"
          echo "$ALL_APK_TAGS" | tail -n 10

          # Extract the highest numerical build number
          HIGHEST_BUILD=$(echo "$ALL_APK_TAGS" | sed -n 's/^apk-build-\([0-9]*\)-.*/\1/p' | sort -n | tail -n 1)

          # Baseline safeguard: Historical latest is known to be Build 167
          if [ -z "$HIGHEST_BUILD" ] || [ "$HIGHEST_BUILD" -lt 167 ]; then
            HIGHEST_BUILD=167
          fi

          NEXT_BUILD=$((HIGHEST_BUILD + 1))
          while echo "$ALL_APK_TAGS" | grep -q "^apk-build-${NEXT_BUILD}-"; do
            echo "Notice: Tag for build $NEXT_BUILD already exists, incrementing..."
            NEXT_BUILD=$((NEXT_BUILD + 1))
          done
          TAG_NAME="apk-build-${NEXT_BUILD}-${{ github.run_attempt }}"

          echo "Highest existing build number: $HIGHEST_BUILD"
          echo "Target next build number:      $NEXT_BUILD"
          echo "Target release tag:            $TAG_NAME"

          echo "build_number=$NEXT_BUILD" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TARGET_APK="${{ steps.verify_apk.outputs.target_apk }}"
          BUILD_KIND="${{ steps.verify_apk.outputs.build_kind }}"
          BUILD_NUM="${{ steps.build_number.outputs.build_number }}"

          if [ -z "$TARGET_APK" ] || [ ! -f "$TARGET_APK" ]; then
            echo "::error::Selected APK does not exist at $TARGET_APK"
            exit 1
          fi

          TEMP_DIR="$RUNNER_TEMP/release_assets"
          mkdir -p "$TEMP_DIR"

          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/_/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="focus_shield"
          fi

          ASSET_NAME="${REPO_NAME}-release-build-${BUILD_NUM}.apk"

          DEST_PATH="$TEMP_DIR/$ASSET_NAME"
          cp "$TARGET_APK" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "::error::Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi

          echo "asset_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "build_kind=$BUILD_KIND" >> $GITHUB_OUTPUT
          echo "Prepared release asset ($BUILD_KIND) at: $DEST_PATH"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_asset.outputs.asset_name }}
          path: ${{ steps.prepare_asset.outputs.asset_path }}
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          BUILD_KIND="${{ steps.prepare_asset.outputs.build_kind }}"
          BUILD_NUM="${{ steps.build_number.outputs.build_number }}"
          TAG_NAME="${{ steps.build_number.outputs.tag_name }}"

          RELEASE_TITLE="Focus Shield Build ${BUILD_NUM}"
          if [ "$BUILD_KIND" = "release" ]; then
            SIGNING_INFO="Optimized Release (Signed with Production Keystore)"
            STATUS_NOTE="Optimized R8 release build signed with production certificate."
          else
            SIGNING_INFO="Optimized Release (Signed with Debug Keystore Fallback)"
            STATUS_NOTE="Optimized R8 release build signed with repository debug keystore fallback."
          fi

          NOTES=$(cat <<EOF
          ### Focus Shield Build ${BUILD_NUM}
          - **Build Number:** ${BUILD_NUM}
          - **Release Tag:** ${TAG_NAME}
          - **Build Type:** $SIGNING_INFO
          - **Package Name:** com.jalaluddin.focusshield
          - **Target SDK:** 36
          - **Asset Name:** $ASSET_NAME
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** ${{ github.sha }}
          - **Status:** $STATUS_NOTE
          EOF
          )

          echo "Publishing release tag $TAG_NAME to GitHub Releases..."
          if gh release create "$TAG_NAME" "$ASSET_PATH" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --latest; then
            echo "release_created=true" >> $GITHUB_OUTPUT
            echo "✓ Release $TAG_NAME published successfully as latest release."
          else
            EXIT_CODE=$?
            echo "::error::GitHub Release creation failed with exit code $EXIT_CODE."
            echo "::error::If this failed due to HTTP 403 (Resource not accessible by integration), please ensure repository Workflow Permissions are set to 'Read and write permissions' in GitHub Settings -> Actions -> General."
            exit $EXIT_CODE
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_NUM="${{ steps.build_number.outputs.build_number }}"
          TAG_NAME="${{ steps.build_number.outputs.tag_name }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          BUILD_KIND="${{ steps.prepare_asset.outputs.build_kind }}"
          RELEASE_CREATED="${{ steps.publish_release.outputs.release_created }}"

          echo "### 📦 APK Build Summary ($BUILD_KIND - Build ${BUILD_NUM})" >> $GITHUB_STEP_SUMMARY
          echo "The $BUILD_KIND APK was built and verified successfully." >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number:** \`${BUILD_NUM}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY

          if [ "$RELEASE_CREATED" = "true" ]; then
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q ".url" 2>/dev/null || echo "")
            if [ -n "$RELEASE_URL" ]; then
              echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "- **Status:** Published to GitHub Releases (Marked as Latest)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** Failed to publish to GitHub Releases (Available under Actions Artifacts)" >> $GITHUB_STEP_SUMMARY
            echo "> **Note:** To enable automatic GitHub Release publishing, verify that **Settings -> Actions -> General -> Workflow permissions** is set to **Read and write permissions**." >> $GITHUB_STEP_SUMMARY
          fi
